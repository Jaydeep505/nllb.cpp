# Fast gate: builds everything and runs all three test binaries against
# synthetic NLLB models generated on the runner. No model download, no secrets,
# no large files - tests/make_tiny_model.py builds a random NLLB from a fixed
# torch seed and both dumpers take --random-ids.
#
# What this protects: a ggml submodule bump that changes a kernel, a refactor
# that breaks the untied-lm_head path, and anyone collapsing NLLB_POS_CUMSUM
# and NLLB_POS_ABSOLUTE back into one rule (ref-pad catches that one).
#
# What it CANNOT protect: anything that only appears on the real 600M - the
# ~4200 residual magnitudes that forced relative tolerances, and the real logit
# margin. Synthetic models have O(1) activations. That is what real-model.yml
# is for.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install python deps
        # CPU wheels only. Plain `pip install torch` pulls the CUDA build and
        # ~2.5 GB of nvidia packages, which is wasted bandwidth here and eats
        # into the runner's 14 GB disk.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy safetensors gguf transformers

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Build synthetic models and convert
        run: |
          python tests/make_tiny_model.py models/tiny-nllb
          python tests/make_tiny_model.py models/deep-nllb \
              --layers 12 --heads 16 --d-model 256 --ffn 512 --vocab 2000 --untied
          # --no-tokenizer: the tiny fixtures are random weights with no
          # tokenizer files, and the converter's post-write check (trap 32)
          # rightly refuses a file without one unless told it is on purpose.
          python tools/convert_nllb_to_gguf.py models/tiny-nllb --no-tokenizer \
              --outfile models/tiny-f32.gguf --outtype f32
          python tools/convert_nllb_to_gguf.py models/deep-nllb --no-tokenizer \
              --outfile models/deep-f32.gguf --outtype f32

      - name: Dump goldens (4 fixtures)
        # ref-eos and ref-pad reuse another fixture's source ids on purpose:
        # the decoder dumper reads ref/<name>.ids.bin back, so encoder and
        # decoder goldens cannot drift apart.
        run: |
          python tools/dump_reference.py models/tiny-nllb --out ref-tiny/ --per-layer --random-ids
          python tools/dump_reference.py models/deep-nllb --out ref-deep/ --per-layer --random-ids
          python tools/dump_decoder_reference.py models/tiny-nllb --out ref-tiny/ \
              --per-layer --random-ids --greedy --forced-bos 7
          python tools/dump_decoder_reference.py models/deep-nllb --out ref-deep/ \
              --per-layer --random-ids --greedy --forced-bos 123
          mkdir -p ref-eos ref-pad
          cp ref-tiny/*.ids.bin ref-tiny/manifest.* ref-eos/
          cp ref-deep/*.ids.bin ref-deep/manifest.* ref-pad/
          # no forced bos -> the model emits eos at step 0 -> the eos stop path
          python tools/dump_decoder_reference.py models/tiny-nllb --out ref-eos/ \
              --random-ids --greedy
          # forced bos = pad_id -> the only fixture that separates the two
          # position rules. 7 of 9 cases fail here under NLLB_POS_CUMSUM.
          python tools/dump_decoder_reference.py models/deep-nllb --out ref-pad/ \
              --random-ids --greedy --forced-bos 1

      - name: Encoder gate
        run: |
          ./build/bin/nllb-test models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test models/deep-f32.gguf ref-deep/ -t 4

      - name: Decoder gate
        run: |
          ./build/bin/nllb-test-decoder models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-decoder models/deep-f32.gguf ref-deep/ -t 4

      - name: Generate gate
        run: |
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-eos/  -t 4
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-pad/  -t 4
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-deep/ -t 4 --check-modes

      - name: KV cache gate - cached vs un-cached, no goldens involved
        # This one compares two C++ paths against each other, so it needs no
        # reference dump; it reads manifest_gen.txt only to reuse the same nine
        # sources. --chunk feeds the prefix several tokens at a time, which is
        # the only thing that exercises the causal mask's n_past offset - at one
        # token per call an offset that is too large masks nothing and passes.
        #
        # It also runs the [arena] pass: the same stepping pass twice, once with
        # nllb_kv_cache::scratch reused across steps and once allocating fresh,
        # held to BIT-IDENTITY. A fresh mmap reads as zero, so an op that reads
        # graph memory it never wrote is silently 0.0 with a fresh arena and is
        # last step's values with a reused one. Nothing else here can see that:
        # `full` is one call per cache so its arena is always fresh, and `step`
        # and `chunk` are held to a tolerance a small stale read hides under.
        run: |
          ./build/bin/nllb-test-cache models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-cache models/tiny-f32.gguf ref-eos/  -t 4
          ./build/bin/nllb-test-cache models/deep-f32.gguf ref-deep/ -t 4
          ./build/bin/nllb-test-cache models/deep-f32.gguf ref-pad/  -t 4

      - name: f16 - build the half-precision fixtures
        run: |
          python tools/convert_nllb_to_gguf.py models/tiny-nllb --no-tokenizer --outfile models/tiny-f16.gguf --outtype f16
          python tools/convert_nllb_to_gguf.py models/deep-nllb --no-tokenizer --outfile models/deep-f16.gguf --outtype f16

      - name: f16 gate - same ids as f32, and every decision provably safe
        # The assertion is EXACT ID EQUALITY between the two precisions. The
        # per-decision margin audit is the reason this gate exists rather than a
        # plain id diff: it counts decisions whose margin was inside the logit
        # error, i.e. that agreed without having to. On the deep synthetic there
        # is one, and the gate says so loudly while still passing - ids matching
        # is the contract, "the fixture supports an f16 claim" is not.
        #
        # Deliberately NOT run here: nllb-test-decoder against an f16 file. Its
        # tolerances are the f32 noise floor, so it fails at ~1e-03 by design.
        # It prints an explanation rather than a bare wall of red.
        run: |
          ./build/bin/nllb-test-precision models/tiny-f32.gguf models/tiny-f16.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-precision models/tiny-f32.gguf models/tiny-f16.gguf ref-eos/  -t 4
          ./build/bin/nllb-test-precision models/deep-f32.gguf models/deep-f16.gguf ref-deep/ -t 4
          ./build/bin/nllb-test-precision models/deep-f32.gguf models/deep-f16.gguf ref-pad/  -t 4

      - name: f16 - generation and the cache must hold at half precision
        # The cache gate is precision-agnostic: its incremental passes are held
        # to the no-cache control rather than to an absolute tolerance, and
        # `full` is bit-identity at any weight type.
        run: |
          ./build/bin/nllb-test-generate models/deep-f16.gguf ref-deep/ -t 4 --use-cache
          ./build/bin/nllb-test-generate models/deep-f16.gguf ref-pad/  -t 4 --use-cache
          ./build/bin/nllb-test-cache    models/tiny-f16.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-cache    models/deep-f16.gguf ref-deep/ -t 4
          ./build/bin/nllb-test-cache    models/deep-f16.gguf ref-pad/  -t 4

      - name: Backend port - no host-pointer access to graph tensors (step 13)
        # On a device backend a tensor's ->data is a handle, not a pointer, and
        # the CPU backend cannot tell the difference: its buffers are host
        # memory, so a stray dereference WORKS here and is garbage on Metal.
        # tests/corrupt_backend.py proves that (mask-through-data is inert on
        # the CPU). This runner has no GPU, so the rule is enforced by reading
        # the source instead: no code line in the library or the CLI may touch
        # ->data. Comments are allowed to talk about it.
        run: |
          if grep -nE -- '->data' src/*.cpp cli/*.cpp | grep -vE '^[^:]+:[0-9]+:\s*//'; then
            echo "::error::->data used in src/ or cli/ - use ggml_backend_tensor_set/_get"
            exit 1
          fi

      - name: Backend port - a named backend that is absent must FAIL, not fall back
        # --backend auto falls back to the CPU. --backend metal must not: a user
        # who asked for the GPU and silently got the CPU would benchmark the
        # wrong thing. This runner has no Metal, so the request must be refused.
        run: |
          ./build/bin/nllb-cli --list-backends
          if ./build/bin/nllb-cli -m models/tiny-f32.gguf --backend metal --tgt deu_Latn "x" 2> /tmp/be.txt; then
            echo "::error::--backend metal succeeded on a machine without Metal"; exit 1
          fi
          grep -q "not available in this build" /tmp/be.txt

      - name: Backend port - corruption matrix (gallocr outputs, the mask, trap 15)
        # Seven mutations of src/nllb.cpp aimed at what the port introduced:
        # a hidden state not marked as an output, the causal mask as data, the
        # cache write ordered after its read. Two are REPORTED, not asserted
        # (an input written through ->data, an input not flagged as one): they
        # work by accident on host memory, which is why the grep above exists.
        # Run at both precisions: the table must not change with the weight type.
        run: |
          python tests/corrupt_backend.py build models/deep-f32.gguf ref-deep/ -t 4
          python tests/corrupt_backend.py build models/deep-f16.gguf ref-deep/ -t 4

      - name: Batching (step 11, rebuilt) - batched vs single-sequence, no goldens
        # [equal] [perm] [mask] [eos] [b1] are BIT-IDENTICAL claims on the CPU;
        # [pad] holds padded rows to an absolute tolerance with [pad1] printed
        # as its control. Seeded random sources: no ref/ directory involved.
        run: |
          python tests/make_shape_model.py models/bsmall-f32.gguf --d-model 256 \
              --enc-layers 4 --dec-layers 4 --heads 4 --ffn 1024 --vocab 4000 --n-ctx 256
          python tests/make_shape_model.py models/bsmall-f16.gguf --d-model 256 \
              --enc-layers 4 --dec-layers 4 --heads 4 --ffn 1024 --vocab 4000 --n-ctx 256 --outtype f16
          ./build/bin/nllb-test-batch models/bsmall-f32.gguf -t 4 --rows 8
          ./build/bin/nllb-test-batch models/bsmall-f16.gguf -t 4 --rows 8
          ./build/bin/nllb-test-batch models/bsmall-f32.gguf -t 4 --kv-f16

      - name: Batching corruption matrix - ten mutations, the SAME table at f32 and f16
        # Eight must be caught, two (trap 43) must stay inert. A matrix that
        # changes with the weight type is a gate that means something different
        # at each one, so the two tables are diffed.
        run: |
          set -o pipefail   # tee must not hide a failing matrix
          python tests/corrupt_batch.py build models/bsmall-f32.gguf -t 4 | tee /tmp/m32.txt
          python tests/corrupt_batch.py build models/bsmall-f16.gguf -t 4 | tee /tmp/m16.txt
          diff <(sed -n '/^mutation/,/^$/p' /tmp/m32.txt) <(sed -n '/^mutation/,/^$/p' /tmp/m16.txt)

      - name: Profiler smoke test - nllb-bench must still run
        # Not a gate on any number: the sandbox and the runner are too noisy for
        # a time to assert on, and the numbers that matter were taken at the
        # real 600M's shape (see PROFILE.md). This only keeps the tool from
        # rotting, which is what happens to a benchmark nothing runs.
        run: ./build/bin/nllb-bench models/deep-f32.gguf -t 4 --src 8 --steps 4

      - name: Generate gate, through the cache
        # Closes the loop against HF directly rather than by composition. If
        # this passes and nllb-test-cache does not, the cache and the un-cached
        # path are both wrong in the same direction - which is worth knowing.
        run: |
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-tiny/ -t 4 --use-cache
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-eos/  -t 4 --use-cache
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-pad/  -t 4 --use-cache
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-deep/ -t 4 --use-cache

      - name: Test the tests - corrupted weights must turn the gates RED
        # A green suite only proves the suite did not fire. Break one tensor on
        # purpose and assert both gates notice; if either exits 0 here, the
        # suite has stopped testing anything and every green run above is
        # meaningless.
        run: |
          set -e
          for spec in "dec.blk.0.attn_q.weight transpose" "position_embd.weight shift"; do
            set -- $spec
            cp models/deep-f32.gguf /tmp/bad.gguf
            python tests/corrupt_gguf.py /tmp/bad.gguf --tensor "$1" --mode "$2"
            if ./build/bin/nllb-test-decoder /tmp/bad.gguf ref-deep/ -t 4 > /dev/null 2>&1; then
              echo "::error::decoder gate stayed green with $1 --mode $2"
              exit 1
            fi
            if ./build/bin/nllb-test-generate /tmp/bad.gguf ref-deep/ -t 4 > /dev/null 2>&1; then
              echo "::error::generate gate stayed green with $1 --mode $2"
              exit 1
            fi
            echo "ok: both gates fired on $1 --mode $2"
          done

      # Deliberately NOT asserted above: nllb-test-cache stays GREEN on a
      # corrupted tensor, because both sides of its comparison read the same
      # corrupted weight and cancel. That is not a hole, it is the division of
      # labour - the decoder and generate gates own "are the weights and the
      # graph right", the cache gate owns "does caching change the answer".
      # Reading a green cache gate as evidence about the model is the mistake.

      - name: CLI - the text -> text gate must fire without the weights
        # tests/verify_translation.py is the first gate here that can ONLY run
        # where the real checkpoint is, and that is exactly where a broken gate
        # is least likely to be noticed. tests/fake_cli.py is an honest
        # stand-in for nllb-cli that looks its answers up, plus ten deliberate
        # breakages - each a mistake the real CLI could plausibly make. The
        # matrix asserts the honest stand-in PASSES and every breakage turns
        # the gate red. No weights, no torch, about a second.
        #
        # Two of the ten (swap, ignore-tgt) are caught by [wiring] alone, which
        # is the argument for that pass existing: it checks the language codes
        # BY POSITION in the id sequences rather than by whether the output
        # reads well, so it works on a model that cannot translate at all.
        run: |
          ./build/bin/nllb-cli --help
          python tests/fake_cli.py --make-goldens ref-fake/
          python tests/verify_translation.py tests/fake_cli.py MODEL ref-fake/
          python tests/fake_cli.py --matrix ref-fake/

      - name: The committed grapheme tables must match their generator
        # src/nllb-grapheme-data.h is generated but COMMITTED, so that building
        # needs no Python. That is only safe if something notices when the two
        # drift apart - a hand-edit, or a `regex` version with a newer Unicode
        # release. This is the something.
        run: |
          pip install regex
          python tools/gen_grapheme_tables.py > /tmp/grapheme.h
          if ! diff -q /tmp/grapheme.h src/nllb-grapheme-data.h > /dev/null; then
            echo "::error::src/nllb-grapheme-data.h is stale. Re-run"
            echo "  python tools/gen_grapheme_tables.py > src/nllb-grapheme-data.h"
            echo "and RE-RUN THE TOKENIZER GATE: a Unicode version bump can move"
            echo "a cluster boundary, which moves the ids."
            diff /tmp/grapheme.h src/nllb-grapheme-data.h | head -40
            exit 1
          fi

      # The tokenizer gate is deliberately NOT here. It needs a real
      # vocabulary - the 256204 pieces, the 514098 merges and the 237539-byte
      # charsmap - and tests/make_tiny_model.py cannot invent one that means
      # anything: a random vocab would exercise the trie walk against a trie
      # nobody trained. It runs in real-model.yml, where tokenizer.json is
      # already on disk. If you want it on every push, the cheap version is to
      # fetch ONLY tokenizer.json (17 MB, no weights) and run
      # tests/make_vocab_gguf.py - at the cost of this workflow depending on
      # huggingface.co, which is the thing it was built not to do.

  # ---------------------------------------------------------------------------
  # Metal (step 13). UNVERIFIED IN CI, hence continue-on-error: GitHub's
  # macOS arm64 runners expose a paravirtualised GPU, and whether ggml-metal
  # initialises on it has not been observed from this repo. What this job runs
  # needs no torch and no download - a small random GGUF with the shape model
  # tooling - and every comparison in it is C++ against C++:
  #   nllb-test-cache      full = exact ON METAL: the cache vs the un-cached
  #                        path, both on the GPU (the un-cached one also
  #                        exercises the CPU fallback for ggml_diag_mask_inf)
  #   nllb-test-precision  --backend cpu:metal, same file twice: exact ids and
  #                        the margin audit, the claim f16 made against f32
  # The acceptance run is on a real M1 with the real checkpoint; see BACKEND.md.
  # ---------------------------------------------------------------------------
  metal:
    runs-on: macos-14
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          ./build/bin/nllb-cli --list-backends
      - name: Small shape fixture
        run: |
          pip install numpy gguf
          python tests/make_shape_model.py models/small-f16.gguf --d-model 256 \
              --enc-layers 4 --dec-layers 4 --heads 4 --ffn 512 --vocab 4000 --n-ctx 128 --outtype f16
          python tests/make_shape_ref.py ref-small/ --vocab 4000 --n-ctx 128 --max-new 24
      - name: Cache gate on Metal
        run: |
          NLLB_ARENA_TRACE=1 NLLB_BACKEND=metal ./build/bin/nllb-test-cache models/small-f16.gguf ref-small/ -t 3
      - name: CPU vs Metal - exact ids and the margin audit
        run: |
          ./build/bin/nllb-test-precision models/small-f16.gguf models/small-f16.gguf ref-small/ \
              -t 3 --backend cpu:metal
      - name: Backend port corruption matrix ON METAL - the same table as on the CPU?
        run: |
          NLLB_BACKEND=metal python tests/corrupt_backend.py build models/small-f16.gguf ref-small/ -t 3
      - name: Batching gate ON METAL
        # [perm] [mask] [eos] compare batched against batched and must hold.
        # [equal]/[b1] compare against the single path, which may pick a
        # different matmul kernel on a GPU (trap 48) - read, then decide.
        run: |
          ./build/bin/nllb-test-batch models/small-f16.gguf -t 3 --backend metal -v

  # ---------------------------------------------------------------------------
  # OPENCL (step 14). What this job can and cannot claim, stated up front so a
  # green tick is not read as more than it is.
  #
  # IT CAN: configure, compile the whole tree clean with the OpenCL backend in
  # it, and assert that doing so leaves the CPU path BIT-IDENTICAL - which is
  # the one thing a build flag can break invisibly, and which
  # nllb-dump-states --diff answers in one run. It also types every backend
  # spelling the docs advertise, because step 14 found `--backend ocl`
  # documented and broken while `--backend opencl` worked: a table that
  # translates names is a claim, and a claim nothing executes is a comment.
  #
  # IT CANNOT: run a single graph on OpenCL. No hosted runner has an OpenCL
  # device that compiles ggml's kernels. pocl (the only ICD installable here)
  # lacks cl_khr_fp16 and is DROPPED at registration, which this job asserts
  # rather than ignores - if pocl ever gains fp16, that step goes red and the
  # acceptance run in BACKEND.md becomes runnable in CI. Until then the OpenCL
  # numbers come from real hardware and this job guards the plumbing.
  # ---------------------------------------------------------------------------
  opencl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: OpenCL headers and ICD loader
        run: sudo apt-get update -qq && sudo apt-get install -y opencl-headers ocl-icd-opencl-dev pocl-opencl-icd clinfo

      - name: Build WITHOUT OpenCL - the baseline for the diff below
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Build WITH OpenCL
        run: |
          cmake -B build-cl -DNLLB_OPENCL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cl -j"$(nproc)"
          ./build-cl/bin/nllb-cli --list-backends

      - name: Small shape fixture
        run: |
          pip install numpy gguf
          python tests/make_shape_model.py models/small-f32.gguf --d-model 256 \
              --enc-layers 4 --dec-layers 4 --heads 4 --ffn 1024 --vocab 4000 --n-ctx 64 --outtype f32
          python tests/make_shape_ref.py ref-small/ --vocab 4000 --n-ctx 64 --max-new 24 --lengths 6 12 24 40

      # THE ASSERTION THIS JOB EXISTS FOR. Linking a second backend into the
      # process must not move one float of the CPU path.
      - name: The OpenCL flag must not move the CPU path
        run: |
          ./build/bin/nllb-dump-states    models/small-f32.gguf ref-small/ /tmp/a.bin -t 2
          ./build-cl/bin/nllb-dump-states models/small-f32.gguf ref-small/ /tmp/b.bin -t 2
          ./build-cl/bin/nllb-dump-states --diff /tmp/a.bin /tmp/b.bin | tee /tmp/diff.txt
          grep -q "^IDENTICAL" /tmp/diff.txt

      - name: The gates still mean what they meant, in the OpenCL build
        run: |
          ./build-cl/bin/nllb-test-cache models/small-f32.gguf ref-small/ -t 2
          python tests/corrupt_backend.py build-cl models/small-f32.gguf ref-small/ -t 2

      # Every spelling BACKEND.md and the handoff advertise. `ocl` was
      # documented and broken from step 13 until step 14 measured it; nothing
      # executed the table, so nothing noticed. A missing device must FAIL with
      # the device list rather than fall back to the CPU - the other half of
      # the trap-49 contract, asserted for Metal in the synthetic job.
      - name: Every documented backend spelling resolves the same way
        run: |
          set -x
          for want in cpu auto gpu opencl ocl OCL OpenCL; do
            out=$(./build-cl/bin/nllb-cli -m /dev/null --backend "$want" --tgt deu_Latn x 2>&1 || true)
            # Only `cpu` and `auto` are required to resolve. `gpu` and every
            # opencl spelling name a DEVICE, and there is no OpenCL device on
            # this runner (see the step below), so they are required to fail
            # with the device list instead - which is the contract, not a
            # defect: `auto` falls back to the CPU and a named backend never
            # does. The first draft of this loop put `gpu` in the first bucket
            # and went red locally, which is the check working.
            case "$want" in
              cpu|auto)
                echo "$out" | grep -q "is not available in this build" && exit 1 ;;
              *)
                echo "$out" | grep -q "devices:" || {
                  echo "$out" | grep -q "failed to read magic" || exit 1; } ;;
            esac
          done

      # An assertion about the ENVIRONMENT, not about this repo. If it ever goes
      # red, pocl grew cl_khr_fp16 and the acceptance run can move into CI.
      - name: pocl is still dropped for want of cl_khr_fp16 (an environment assertion)
        run: |
          ./build-cl/bin/nllb-cli --list-backends 2>&1 | tee /tmp/be.txt
          grep -q "does not support FP16" /tmp/be.txt \
            && echo "as expected: no OpenCL device here, so no graph ran on OpenCL" \
            || echo "::warning::pocl no longer drops out - see BACKEND.md, the acceptance run may now be runnable in CI"

  # ---------------------------------------------------------------------------
  # CUDA (step 16). Same shape as the OpenCL job above and the same honesty
  # about what a green tick means.
  #
  # IT CAN: configure with the CUDA backend, compile the whole tree clean with
  # nvcc in the build, and assert that doing so leaves the CPU path
  # BIT-IDENTICAL - the one thing a build flag can break invisibly. It also
  # types every documented spelling, because step 14 found `ocl` documented and
  # broken while `opencl` worked and nothing executed the table.
  #
  # IT CANNOT: run a single graph. No hosted runner has an NVIDIA GPU. The
  # numbers come from real hardware (Colab, a workstation) and this job guards
  # the plumbing. The last step asserts the ABSENCE of a CUDA device, so if a
  # runner ever grows one it goes red and the acceptance run in BACKEND.md
  # becomes runnable here.
  # ---------------------------------------------------------------------------
  cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CUDA toolkit (no driver, no device - nvcc is all this job needs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nvidia-cuda-toolkit
          nvcc --version

      - name: Build WITHOUT CUDA - the baseline for the diff below
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      # 75-virtual only: nothing will execute it, and a -real target doubles
      # the nvcc time for device code no runner can run.
      - name: Build WITH CUDA
        run: |
          cmake -B build-cu -DNLLB_CUDA=ON -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CUDA_ARCHITECTURES=75-virtual
          cmake --build build-cu -j"$(nproc)"
          ./build-cu/bin/nllb-cli --list-backends

      - name: Small shape fixture
        run: |
          pip install numpy gguf
          python tests/make_shape_model.py models/small-f32.gguf --d-model 256 \
              --enc-layers 4 --dec-layers 4 --heads 4 --ffn 1024 --vocab 4000 --n-ctx 64 --outtype f32
          python tests/make_shape_ref.py ref-small/ --vocab 4000 --n-ctx 64 --max-new 24 --lengths 6 12 24 40

      # THE ASSERTION THIS JOB EXISTS FOR. Linking a second backend into the
      # process must not move one float of the CPU path.
      - name: The CUDA flag must not move the CPU path
        run: |
          ./build/bin/nllb-dump-states    models/small-f32.gguf ref-small/ /tmp/a.bin -t 2
          ./build-cu/bin/nllb-dump-states models/small-f32.gguf ref-small/ /tmp/b.bin -t 2
          ./build-cu/bin/nllb-dump-states --diff /tmp/a.bin /tmp/b.bin | tee /tmp/diff.txt
          grep -q "^IDENTICAL" /tmp/diff.txt

      - name: The gates still mean what they meant, in the CUDA build
        run: |
          ./build-cu/bin/nllb-test-cache models/small-f32.gguf ref-small/ -t 2
          python tests/corrupt_backend.py build-cu models/small-f32.gguf ref-small/ -t 2

      # `cuda` has one spelling, unlike metal/MTL and opencl/ocl, so this loop
      # is cheaper than the OpenCL one - but it is the same contract: a missing
      # device FAILS with the device list rather than falling back to the CPU.
      - name: Every documented backend spelling resolves the same way
        run: |
          set -x
          for want in cpu auto gpu cuda CUDA cuda0; do
            out=$(./build-cu/bin/nllb-cli -m /dev/null --backend "$want" --tgt deu_Latn x 2>&1 || true)
            case "$want" in
              cpu|auto)
                echo "$out" | grep -q "is not available in this build" && exit 1 ;;
              *)
                echo "$out" | grep -q "devices:" || {
                  echo "$out" | grep -q "failed to read magic" || exit 1; } ;;
            esac
          done

      # An assertion about the ENVIRONMENT, not about this repo.
      - name: No CUDA device on this runner (so no graph ran on CUDA)
        run: |
          ./build-cu/bin/nllb-cli --list-backends 2>&1 | tee /tmp/be.txt
          grep -qi "CUDA" /tmp/be.txt \
            && echo "::warning::a CUDA device appeared - see BACKEND.md, the acceptance run may now be runnable in CI" \
            || echo "as expected: no CUDA device here, so nothing ran on it"

  # ---------------------------------------------------------------------------
  # VULKAN (step 17). The first device-backend job that RUNS GRAPHS in CI.
  #
  # Mesa's lavapipe is a conformant Vulkan 1.4 device that runs on the CPU.
  # ggml-vulkan hides CPU-type devices unless GGML_VK_VISIBLE_DEVICES names
  # them, so this job sets it. lavapipe reports uma: 0 - buffers are "device"
  # memory to ggml - and it is what found the gapped-stride bug in ggml-vulkan's
  # mul_mat (trap 55): the cache gate went red here before any Adreno saw it.
  #
  # IT CAN: build, keep the CPU path bit-identical, run the cache gate, the
  # cross-backend precision gate and the corruption matrix ON a Vulkan device.
  # IT CANNOT: say anything about speed, or about an Adreno's shader compiler.
  # ---------------------------------------------------------------------------
  vulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GGML_VK_VISIBLE_DEVICES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vulkan headers, loader, glslc, SPIRV-Headers, and lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev glslc spirv-headers mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | grep -E "deviceName|driverName|apiVersion"

      - name: Build WITHOUT Vulkan - the baseline for the diff below
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Build WITH Vulkan
        run: |
          cmake -B build-vk -DNLLB_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vk -j"$(nproc)"
          ./build-vk/bin/nllb-cli --list-backends | tee /tmp/be.txt
          grep -q "^Vulkan0" /tmp/be.txt

      - name: Small shape fixtures
        run: |
          pip install numpy gguf
          for t in f32 f16; do
            python tests/make_shape_model.py models/small-$t.gguf --d-model 256 \
                --enc-layers 4 --dec-layers 4 --heads 4 --ffn 1024 --vocab 4000 --n-ctx 64 --outtype $t
          done
          python tests/make_shape_ref.py ref-small/ --vocab 4000 --n-ctx 64 --max-new 24 --lengths 6 12 24 40

      - name: The Vulkan flag must not move the CPU path
        run: |
          for t in f32 f16; do
            ./build/bin/nllb-dump-states    models/small-$t.gguf ref-small/ /tmp/a.bin -t 2
            ./build-vk/bin/nllb-dump-states models/small-$t.gguf ref-small/ /tmp/b.bin -t 2
            ./build-vk/bin/nllb-dump-states --diff /tmp/a.bin /tmp/b.bin | tee /tmp/diff.txt
            grep -q "^IDENTICAL" /tmp/diff.txt
          done

      # The K-view workaround is an exact copy; it must not move the CPU either.
      - name: NLLB_KV_CONT=1 is arithmetic-free on the CPU
        run: |
          ./build/bin/nllb-dump-states models/small-f32.gguf ref-small/ /tmp/a.bin -t 2
          NLLB_KV_CONT=1 ./build/bin/nllb-dump-states models/small-f32.gguf ref-small/ /tmp/c.bin -t 2
          ./build/bin/nllb-dump-states --diff /tmp/a.bin /tmp/c.bin | grep -q "^IDENTICAL"

      - name: KV ops, device vs CPU (trap 55 canary)
        run: |
          ./build-vk/bin/nllb-probe-kv-ops vulkan | tee /tmp/probe.txt || true
          # did it RUN? An empty table passes every grep below.
          grep -q "^device: Vulkan0" /tmp/probe.txt
          test "$(grep -cE '^(cpy|mul_mat)' /tmp/probe.txt)" -eq 45
          ! grep -E "^mul_mat\(cont\(K\)|^cpy|^mul_mat\(V view" /tmp/probe.txt | grep -q "BAD"
          grep -q "^mul_mat(K view, q).*BAD" /tmp/probe.txt \
            || echo "::warning::ggml-vulkan now reads gapped batch strides correctly - kv_k_cont can be retired (trap 55)"

      - name: Cache gate ON VULKAN - full = exact, [arena] exact, f32 and f16
        run: |
          for t in f32 f16; do
            NLLB_BACKEND=vulkan NLLB_ARENA_TRACE=1 ./build-vk/bin/nllb-test-cache models/small-$t.gguf ref-small/ -t 2 | tee /tmp/cache.txt
            grep "cached step" /tmp/cache.txt | grep -vqE "splits +1 +compute" && { echo "a cached step split"; exit 1; } || true
          done

      - name: The workaround is load-bearing - without it the cache gate must go RED
        run: |
          if NLLB_KV_CONT=0 NLLB_BACKEND=vulkan ./build-vk/bin/nllb-test-cache models/small-f32.gguf ref-small/ -t 2 > /tmp/nocont.txt; then
            echo "::warning::cache gate passes on Vulkan without kv_k_cont - ggml fixed trap 55?"
          else
            grep -q "FIRST BAD LAYER 1" /tmp/nocont.txt
          fi

      - name: CPU vs Vulkan - exact ids and the margin audit
        run: |
          for t in f32 f16; do
            ./build-vk/bin/nllb-test-precision models/small-$t.gguf models/small-$t.gguf ref-small/ -t 2 --backend cpu:vulkan
          done

      - name: Backend corruption matrix ON VULKAN - the same table as on the CPU?
        run: NLLB_BACKEND=vulkan python tests/corrupt_backend.py build-vk models/small-f16.gguf ref-small/ -t 2

      - name: Every documented backend spelling resolves
        run: |
          for want in cpu auto gpu vulkan vk VK Vulkan Vulkan0; do
            out=$(./build-vk/bin/nllb-cli -m /dev/null --backend "$want" --tgt deu_Latn x 2>&1 || true)
            echo "$want: $out" | tail -1
            echo "$out" | grep -q "is not available in this build" && exit 1 || true
          done
