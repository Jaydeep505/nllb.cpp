# Fast gate: builds everything and runs all three test binaries against
# synthetic NLLB models generated on the runner. No model download, no secrets,
# no large files - tests/make_tiny_model.py builds a random NLLB from a fixed
# torch seed and both dumpers take --random-ids.
#
# What this protects: a ggml submodule bump that changes a kernel, a refactor
# that breaks the untied-lm_head path, and anyone collapsing NLLB_POS_CUMSUM
# and NLLB_POS_ABSOLUTE back into one rule (ref-pad catches that one).
#
# What it CANNOT protect: anything that only appears on the real 600M - the
# ~4200 residual magnitudes that forced relative tolerances, and the real logit
# margin. Synthetic models have O(1) activations. That is what real-model.yml
# is for.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install python deps
        # CPU wheels only. Plain `pip install torch` pulls the CUDA build and
        # ~2.5 GB of nvidia packages, which is wasted bandwidth here and eats
        # into the runner's 14 GB disk.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy safetensors gguf transformers

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Build synthetic models and convert
        run: |
          python tests/make_tiny_model.py models/tiny-nllb
          python tests/make_tiny_model.py models/deep-nllb \
              --layers 12 --heads 16 --d-model 256 --ffn 512 --vocab 2000 --untied
          python tools/convert_nllb_to_gguf.py models/tiny-nllb \
              --outfile models/tiny-f32.gguf --outtype f32
          python tools/convert_nllb_to_gguf.py models/deep-nllb \
              --outfile models/deep-f32.gguf --outtype f32

      - name: Dump goldens (4 fixtures)
        # ref-eos and ref-pad reuse another fixture's source ids on purpose:
        # the decoder dumper reads ref/<name>.ids.bin back, so encoder and
        # decoder goldens cannot drift apart.
        run: |
          python tools/dump_reference.py models/tiny-nllb --out ref-tiny/ --per-layer --random-ids
          python tools/dump_reference.py models/deep-nllb --out ref-deep/ --per-layer --random-ids
          python tools/dump_decoder_reference.py models/tiny-nllb --out ref-tiny/ \
              --per-layer --random-ids --greedy --forced-bos 7
          python tools/dump_decoder_reference.py models/deep-nllb --out ref-deep/ \
              --per-layer --random-ids --greedy --forced-bos 123
          mkdir -p ref-eos ref-pad
          cp ref-tiny/*.ids.bin ref-tiny/manifest.* ref-eos/
          cp ref-deep/*.ids.bin ref-deep/manifest.* ref-pad/
          # no forced bos -> the model emits eos at step 0 -> the eos stop path
          python tools/dump_decoder_reference.py models/tiny-nllb --out ref-eos/ \
              --random-ids --greedy
          # forced bos = pad_id -> the only fixture that separates the two
          # position rules. 7 of 9 cases fail here under NLLB_POS_CUMSUM.
          python tools/dump_decoder_reference.py models/deep-nllb --out ref-pad/ \
              --random-ids --greedy --forced-bos 1

      - name: Encoder gate
        run: |
          ./build/bin/nllb-test models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test models/deep-f32.gguf ref-deep/ -t 4

      - name: Decoder gate
        run: |
          ./build/bin/nllb-test-decoder models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-decoder models/deep-f32.gguf ref-deep/ -t 4

      - name: Generate gate
        run: |
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-eos/  -t 4
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-pad/  -t 4
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-deep/ -t 4 --check-modes

      - name: KV cache gate - cached vs un-cached, no goldens involved
        # This one compares two C++ paths against each other, so it needs no
        # reference dump; it reads manifest_gen.txt only to reuse the same nine
        # sources. --chunk feeds the prefix several tokens at a time, which is
        # the only thing that exercises the causal mask's n_past offset - at one
        # token per call an offset that is too large masks nothing and passes.
        #
        # It also runs the [arena] pass: the same stepping pass twice, once with
        # nllb_kv_cache::scratch reused across steps and once allocating fresh,
        # held to BIT-IDENTITY. A fresh mmap reads as zero, so an op that reads
        # graph memory it never wrote is silently 0.0 with a fresh arena and is
        # last step's values with a reused one. Nothing else here can see that:
        # `full` is one call per cache so its arena is always fresh, and `step`
        # and `chunk` are held to a tolerance a small stale read hides under.
        run: |
          ./build/bin/nllb-test-cache models/tiny-f32.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-cache models/tiny-f32.gguf ref-eos/  -t 4
          ./build/bin/nllb-test-cache models/deep-f32.gguf ref-deep/ -t 4
          ./build/bin/nllb-test-cache models/deep-f32.gguf ref-pad/  -t 4

      - name: f16 - build the half-precision fixtures
        run: |
          python tools/convert_nllb_to_gguf.py models/tiny-nllb --outfile models/tiny-f16.gguf --outtype f16
          python tools/convert_nllb_to_gguf.py models/deep-nllb --outfile models/deep-f16.gguf --outtype f16

      - name: f16 gate - same ids as f32, and every decision provably safe
        # The assertion is EXACT ID EQUALITY between the two precisions. The
        # per-decision margin audit is the reason this gate exists rather than a
        # plain id diff: it counts decisions whose margin was inside the logit
        # error, i.e. that agreed without having to. On the deep synthetic there
        # is one, and the gate says so loudly while still passing - ids matching
        # is the contract, "the fixture supports an f16 claim" is not.
        #
        # Deliberately NOT run here: nllb-test-decoder against an f16 file. Its
        # tolerances are the f32 noise floor, so it fails at ~1e-03 by design.
        # It prints an explanation rather than a bare wall of red.
        run: |
          ./build/bin/nllb-test-precision models/tiny-f32.gguf models/tiny-f16.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-precision models/tiny-f32.gguf models/tiny-f16.gguf ref-eos/  -t 4
          ./build/bin/nllb-test-precision models/deep-f32.gguf models/deep-f16.gguf ref-deep/ -t 4
          ./build/bin/nllb-test-precision models/deep-f32.gguf models/deep-f16.gguf ref-pad/  -t 4

      - name: f16 - generation and the cache must hold at half precision
        # The cache gate is precision-agnostic: its incremental passes are held
        # to the no-cache control rather than to an absolute tolerance, and
        # `full` is bit-identity at any weight type.
        run: |
          ./build/bin/nllb-test-generate models/deep-f16.gguf ref-deep/ -t 4 --use-cache
          ./build/bin/nllb-test-generate models/deep-f16.gguf ref-pad/  -t 4 --use-cache
          ./build/bin/nllb-test-cache    models/tiny-f16.gguf ref-tiny/ -t 4
          ./build/bin/nllb-test-cache    models/deep-f16.gguf ref-deep/ -t 4
          ./build/bin/nllb-test-cache    models/deep-f16.gguf ref-pad/  -t 4

      - name: Profiler smoke test - nllb-bench must still run
        # Not a gate on any number: the sandbox and the runner are too noisy for
        # a time to assert on, and the numbers that matter were taken at the
        # real 600M's shape (see PROFILE.md). This only keeps the tool from
        # rotting, which is what happens to a benchmark nothing runs.
        run: ./build/bin/nllb-bench models/deep-f32.gguf -t 4 --src 8 --steps 4

      - name: Generate gate, through the cache
        # Closes the loop against HF directly rather than by composition. If
        # this passes and nllb-test-cache does not, the cache and the un-cached
        # path are both wrong in the same direction - which is worth knowing.
        run: |
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-tiny/ -t 4 --use-cache
          ./build/bin/nllb-test-generate models/tiny-f32.gguf ref-eos/  -t 4 --use-cache
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-pad/  -t 4 --use-cache
          ./build/bin/nllb-test-generate models/deep-f32.gguf ref-deep/ -t 4 --use-cache

      - name: Test the tests - corrupted weights must turn the gates RED
        # A green suite only proves the suite did not fire. Break one tensor on
        # purpose and assert both gates notice; if either exits 0 here, the
        # suite has stopped testing anything and every green run above is
        # meaningless.
        run: |
          set -e
          for spec in "dec.blk.0.attn_q.weight transpose" "position_embd.weight shift"; do
            set -- $spec
            cp models/deep-f32.gguf /tmp/bad.gguf
            python tests/corrupt_gguf.py /tmp/bad.gguf --tensor "$1" --mode "$2"
            if ./build/bin/nllb-test-decoder /tmp/bad.gguf ref-deep/ -t 4 > /dev/null 2>&1; then
              echo "::error::decoder gate stayed green with $1 --mode $2"
              exit 1
            fi
            if ./build/bin/nllb-test-generate /tmp/bad.gguf ref-deep/ -t 4 > /dev/null 2>&1; then
              echo "::error::generate gate stayed green with $1 --mode $2"
              exit 1
            fi
            echo "ok: both gates fired on $1 --mode $2"
          done

      # Deliberately NOT asserted above: nllb-test-cache stays GREEN on a
      # corrupted tensor, because both sides of its comparison read the same
      # corrupted weight and cancel. That is not a hole, it is the division of
      # labour - the decoder and generate gates own "are the weights and the
      # graph right", the cache gate owns "does caching change the answer".
      # Reading a green cache gate as evidence about the model is the mistake.

      - name: The committed grapheme tables must match their generator
        # src/nllb-grapheme-data.h is generated but COMMITTED, so that building
        # needs no Python. That is only safe if something notices when the two
        # drift apart - a hand-edit, or a `regex` version with a newer Unicode
        # release. This is the something.
        run: |
          pip install regex
          python tools/gen_grapheme_tables.py > /tmp/grapheme.h
          if ! diff -q /tmp/grapheme.h src/nllb-grapheme-data.h > /dev/null; then
            echo "::error::src/nllb-grapheme-data.h is stale. Re-run"
            echo "  python tools/gen_grapheme_tables.py > src/nllb-grapheme-data.h"
            echo "and RE-RUN THE TOKENIZER GATE: a Unicode version bump can move"
            echo "a cluster boundary, which moves the ids."
            diff /tmp/grapheme.h src/nllb-grapheme-data.h | head -40
            exit 1
          fi

      # The tokenizer gate is deliberately NOT here. It needs a real
      # vocabulary - the 256204 pieces, the 514098 merges and the 237539-byte
      # charsmap - and tests/make_tiny_model.py cannot invent one that means
      # anything: a random vocab would exercise the trie walk against a trie
      # nobody trained. It runs in real-model.yml, where tokenizer.json is
      # already on disk. If you want it on every push, the cheap version is to
      # fetch ONLY tokenizer.json (17 MB, no weights) and run
      # tests/make_vocab_gguf.py - at the cost of this workflow depending on
      # huggingface.co, which is the thing it was built not to do.
