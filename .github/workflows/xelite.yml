# The Snapdragon X Elite package: CPU + Vulkan + OpenCL, built NATIVELY on Windows on
# Arm, tested on the CI runner's CPU, shipped as one zip for a Qualcomm Device
# Cloud (QDC) session. Full walkthrough: docs/vulkan.md, docs/opencl.md.
#
#   Actions tab -> "xelite" -> Run workflow        (or push a tag xelite-*)
#   download the artifact nllb-xelite.zip, copy it to the QDC device,
#   unzip, and:  powershell -ExecutionPolicy Bypass -File .\run.ps1
#
# WHY NATIVE AND NOT CROSS-COMPILED FROM x64:
#  1. ggml REFUSES MSVC on Arm (src/ggml-cpu/CMakeLists.txt: "MSVC is not
#     supported for ARM, use clang"). The compiler has to be clang, with
#     MSVC's Arm64 libraries.
#  2. ggml-vulkan compiles and RUNS a host tool (vulkan-shaders-gen) during the
#     build. On a native Arm64 runner host = target and nothing needs crossing.
#
# WHY GGML_NATIVE=OFF: the runner is an Azure Cobalt 100 (Neoverse N2, Armv9
# WITH SVE2). The X Elite's Oryon cores are Armv8.7 WITHOUT SVE. A native build
# on the runner would emit SVE and die on the device with an illegal
# instruction - in the CPU backend, i.e. in the reference every GPU number is
# compared against. One fixed -march for both machines, which also makes the
# runner-vs-device CPU diff in run.ps1 section 3 an exact assertion.
name: xelite

on:
  workflow_dispatch:
  push:
    tags: [ 'xelite-*' ]

env:
  # The ggml commit this package is built and verified on (lavapipe gates,
  # docs/vulkan.md). A zip built on a different pin would make the QDC
  # session measure the bump. Both jobs refuse to build anything else.
  GGML_PIN: ffa4e8b
  # Khronos OpenCL SDK pieces for the opencl\ build (headers + ICD loader,
  # built from source for Arm64: there is no prebuilt Arm64 loader to download).
  OPENCL_TAG: v2024.10.24
  # llama.cpp's choice for the X Elite; the runner supports it too, so the SAME
  # binary is the one tested here and on the device.
  ARM_ARCH: armv8.7-a

jobs:
  # -------------------------------------------------------------------------
  # Fixtures on a runner with Python wheels for everything. Random weights with
  # a small NLLB geometry: the cache gate compares two C++ paths, so the weights
  # cancel and ~30 MB is a complete test of a backend.
  # -------------------------------------------------------------------------
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: ggml submodule is at the pinned commit
        shell: bash
        run: |
          have=$(git -C ggml rev-parse --short=7 HEAD)
          echo "ggml at $have, pin $GGML_PIN"
          test "$have" = "$GGML_PIN" || { echo "::error::ggml is $have, not $GGML_PIN. Update GGML_PIN in xelite.yml after re-running the vulkan CI job on the new pin."; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy gguf
      - name: Shape fixtures (f16 and f32) + structural ref
        run: |
          for t in f16 f32; do
            python tests/make_shape_model.py models/shape-small-$t.gguf --d-model 256 \
              --enc-layers 4 --dec-layers 4 --heads 4 --ffn 1024 --vocab 4000 \
              --n-ctx 64 --outtype $t
          done
          python tests/make_shape_ref.py ref-shape/ --vocab 4000 --n-ctx 64 \
              --max-new 24 --lengths 6 12 24 40
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: |
            models/shape-small-f16.gguf
            models/shape-small-f32.gguf
            ref-shape/

  # -------------------------------------------------------------------------
  windows-arm64:
    needs: fixtures
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/download-artifact@v4
        with: { name: fixtures, path: . }
      - name: ggml submodule is at the pinned commit
        shell: bash
        run: |
          have=$(git -C ggml rev-parse --short=7 HEAD)
          test "$have" = "$GGML_PIN" || { echo "::error::ggml is $have, not $GGML_PIN"; exit 1; }

      # The LunarG SDK has a Windows-on-Arm build ("warm"): arm64 glslc, the
      # arm64 vulkan-1.lib import library and SPIRV-Headers' CMake config.
      # Only the BUILD needs it - on the device vulkan-1.dll comes from the
      # Adreno driver (System32).
      - name: Vulkan SDK (Windows on Arm)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Invoke-RestMethod https://vulkan.lunarg.com/sdk/latest/warm.txt).Trim()
          Write-Host "Vulkan SDK $ver"
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vksdk.exe" "https://sdk.lunarg.com/sdk/download/$ver/warm/vulkan_sdk.exe"
          & "$env:RUNNER_TEMP\vksdk.exe" --root "C:\VulkanSDK\$ver" --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "C:\VulkanSDK\$ver\bin\glslc.exe")) { throw "SDK install did not produce glslc.exe" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\bin"
          "vulkan_sdk=$ver" | Out-File -Append "$env:RUNNER_TEMP\build-info.txt"

      # ggml-opencl embeds its .cl kernels with a Python script at build time.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', architecture: arm64 }

      # The OpenCL build links against the Khronos ICD loader (OpenCL.lib) and
      # ships its OpenCL.dll; at run time that loader finds the Adreno driver
      # through HKLM\SOFTWARE\Khronos\OpenCL\Vendors. Headers + loader are
      # built for Arm64 here and installed into one prefix.
      - name: OpenCL headers + ICD loader (Windows on Arm)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          set PFX=%RUNNER_TEMP%\opencl
          git clone --depth 1 -b %OPENCL_TAG% https://github.com/KhronosGroup/OpenCL-Headers "%RUNNER_TEMP%\OpenCL-Headers" || exit /b 1
          cmake -S "%RUNNER_TEMP%\OpenCL-Headers" -B "%RUNNER_TEMP%\oh-build" -G Ninja -DCMAKE_INSTALL_PREFIX="%PFX%" -DBUILD_TESTING=OFF || exit /b 1
          cmake --build "%RUNNER_TEMP%\oh-build" --target install || exit /b 1
          rem The loader is plain C: cl.exe from vcvars is fine here (ggml's refusal of MSVC on Arm is about ggml-cpu).
          git clone --depth 1 -b %OPENCL_TAG% https://github.com/KhronosGroup/OpenCL-ICD-Loader "%RUNNER_TEMP%\OpenCL-ICD-Loader" || exit /b 1
          cmake -S "%RUNNER_TEMP%\OpenCL-ICD-Loader" -B "%RUNNER_TEMP%\icd-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_PREFIX_PATH="%PFX%" -DCMAKE_INSTALL_PREFIX="%PFX%" -DOPENCL_ICD_LOADER_HEADERS_DIR="%PFX%\include" -DBUILD_TESTING=OFF || exit /b 1
          cmake --build "%RUNNER_TEMP%\icd-build" --target install || exit /b 1
          dir "%PFX%\lib" "%PFX%\bin"
          if not exist "%PFX%\lib\OpenCL.lib" (echo OpenCL.lib missing & exit /b 1)
          if not exist "%PFX%\bin\OpenCL.dll" (echo OpenCL.dll missing & exit /b 1)
          rem Static CRT, like every .exe in the zip: a wiped QDC image need not have
          rem the VC++ redistributable, and a missing VCRUNTIME140.dll behind
          rem OpenCL.dll would look exactly like trap 60 (0xC0000135).
          dumpbin /dependents "%PFX%\bin\OpenCL.dll"
          dumpbin /dependents "%PFX%\bin\OpenCL.dll" | findstr /i "vcruntime msvcp" && (echo OpenCL.dll needs the VC++ runtime & exit /b 1)
          echo opencl_sdk=%OPENCL_TAG%>> "%RUNNER_TEMP%\build-info.txt"

      # THREE builds of one commit: cpu (the reference, which always starts even
      # if vulkan-1.dll is missing), vulkan and opencl. One backend per build so a
      # missing driver DLL cannot stop another backend's run, and so `auto` is
      # never ambiguous (ggml registers Vulkan before OpenCL). Same flags apart from the one
      # backend switch. Static CRT so nothing needs the VC++ redistributable on
      # a freshly wiped QDC image. The server is skipped: not needed on the device.
      # BUILD_SHARED_LIBS=OFF: on Windows ggml defaults to DLLs (ggml.dll,
      # ggml-base.dll, ggml-cpu.dll, ggml-vulkan.dll). The first QDC run died with
      # 0xC0000135 because the zip shipped the .exes without them. Static linking
      # makes every .exe self-contained; only the driver's vulkan-1.dll is external.
      - name: Build cpu / vulkan / opencl (clang, Ninja, native Arm64)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" arm64
          where clang
          clang --version
          set COMMON=-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=%ARM_ARCH% -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF -DNLLB_BUILD_SERVER=OFF
          cmake -B build-cpu %COMMON% || exit /b 1
          cmake --build build-cpu -j || exit /b 1
          cmake -B build-vulkan %COMMON% -DNLLB_VULKAN=ON || exit /b 1
          cmake --build build-vulkan -j || exit /b 1
          rem NLLB_ADRENO=ON: ggml's Adreno-tuned kernels - this package only ever runs on the X1-85.
          cmake -B build-opencl %COMMON% -DNLLB_OPENCL=ON -DNLLB_ADRENO=ON -DOpenCL_INCLUDE_DIR="%RUNNER_TEMP%\opencl\include" -DOpenCL_LIBRARY="%RUNNER_TEMP%\opencl\lib\OpenCL.lib" || exit /b 1
          cmake --build build-opencl -j || exit /b 1
          copy /y "%RUNNER_TEMP%\opencl\bin\OpenCL.dll" build-opencl\bin\ || exit /b 1

      # What CAN be proven on a GPU-less runner: the binaries start, the CPU
      # gate passes, and neither GPU flag moves the CPU path.
      - name: CPU gates on the runner, and the GPU flags must not move the CPU path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($b in "cpu","vulkan","opencl") { & "build-$b\bin\nllb-cli.exe" --list-backends }
          & build-cpu\bin\nllb-test-cache.exe models\shape-small-f16.gguf ref-shape -t 4
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force baseline | Out-Null
          foreach ($p in "f16","f32") {
            & build-cpu\bin\nllb-dump-states.exe models\shape-small-$p.gguf ref-shape baseline\runner-cpu-$p.bin -t 4
            foreach ($g in "vulkan","opencl") {
              & build-$g\bin\nllb-dump-states.exe models\shape-small-$p.gguf ref-shape "$env:RUNNER_TEMP\$g-$p.bin" -t 4 --backend cpu
              $d = & build-cpu\bin\nllb-dump-states.exe --diff baseline\runner-cpu-$p.bin "$env:RUNNER_TEMP\$g-$p.bin"
              $d | Out-Host
              if (-not ($d -match "^IDENTICAL")) { Write-Error "$g build moved the CPU path at $p" }
            }
          }

      - name: Package nllb-xelite.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "nllb-xelite"
          $exes = "nllb-cli","nllb-test-cache","nllb-test-precision","nllb-test-batch","nllb-dump-states","nllb-bench","nllb-probe-kv-ops"
          foreach ($b in "cpu","vulkan","opencl") {
            New-Item -ItemType Directory -Force "$pkg\$b" | Out-Null
            foreach ($e in $exes) { Copy-Item "build-$b\bin\$e.exe" "$pkg\$b\" }
            # belt and braces: ship any DLL the build produced. Only opencl\ has
            # one by design: the Khronos loader OpenCL.dll.
            Get-ChildItem "build-$b\bin\*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$pkg\$b\"
          }
          # Run every packaged .exe FROM THE PACKAGE, not from the build dir, so a
          # missing DLL fails here instead of on the device. 0xC0000135 = -1073741515.
          if (-not (Test-Path "$pkg\opencl\OpenCL.dll")) { throw "opencl\OpenCL.dll is not in the package" }
          foreach ($b in "cpu","vulkan","opencl") {
            foreach ($e in $exes) {
              $p = Start-Process -FilePath "$pkg\$b\$e.exe" -ArgumentList "--help" -NoNewWindow -Wait -PassThru `
                     -RedirectStandardOutput "$env:RUNNER_TEMP\o.txt" -RedirectStandardError "$env:RUNNER_TEMP\e.txt"
              if ($p.ExitCode -eq -1073741515) { throw "$b\$e.exe does not start from the package: a DLL is missing" }
            }
            & "$pkg\$b\nllb-cli.exe" --list-backends
            if ($LASTEXITCODE) { throw "$b\nllb-cli.exe --list-backends failed from the package" }
          }
          Copy-Item -Recurse models, ref-shape, baseline "$pkg\"
          Copy-Item scripts\qdc\run.ps1, scripts\qdc\sentences.txt, docs\vulkan.md, docs\opencl.md "$pkg\"
          $info = @(
            "commit=$env:GITHUB_SHA",
            "ggml=$(git -C ggml describe --tags --always)",
            "arch=$env:ARM_ARCH  GGML_NATIVE=OFF  compiler=clang (msvc abi)  crt=static",
            "runner=$env:RUNNER_NAME ($env:PROCESSOR_IDENTIFIER)"
          ) + (Get-Content "$env:RUNNER_TEMP\build-info.txt")
          $info | Set-Content "$pkg\BUILD-INFO.txt"
          Get-Content "$pkg\BUILD-INFO.txt"
          Compress-Archive -Path "$pkg\*" -DestinationPath nllb-xelite.zip

      - uses: actions/upload-artifact@v4
        with:
          name: nllb-xelite
          path: nllb-xelite.zip
